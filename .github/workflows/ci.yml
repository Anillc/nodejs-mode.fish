name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakanajs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  prepare:
    name: check version bump
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check package version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          package_json=sakanajs/package.json
          version=$(jq -r .version "$package_json")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "v$version is already tagged; nothing to publish"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag v$version already exists" >&2
            exit 1
          fi

          if [ "$EVENT" = "push" ]; then
            if git cat-file -e "$BEFORE_SHA:$package_json" 2>/dev/null; then
              previous_version=$(git show "$BEFORE_SHA:$package_json" | jq -r .version)
            else
              previous_version=
            fi
            if [ -n "$previous_version" ] && [ "$version" = "$previous_version" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "package.json changed without a version bump; skipping release"
              exit 0
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

  npm:
    name: publish npm package
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sakanajs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance

  release:
    name: tag and create the release
    needs: [prepare, npm]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
